# Publishes a production release image for market-trading-lab and its collectors without
# any infra credential. Trading Lab is part of production Market: its token and database
# URL come from Core's envelope (infra runtime.secretsFrom), so this publishes no secrets.
# Activation stays a separate, manual step: an infra operator runs aiaiaiai-org/infra
# "Deploy workload" with the image digest this run prints.
name: Publish Trading Lab production release

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: trading-lab-production-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      actions: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/0xda-market/trading-lab
    steps:
      - name: Gate on exact master Full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/master || { echo "::error::Only master can be released." >&2; exit 1; }
          runs="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&head_sha=$GITHUB_SHA&per_page=100")"
          jq -e --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master"
              and .status == "completed" and .conclusion == "success")] | length > 0
          ' <<< "$runs" >/dev/null || { echo "::error::Successful master push Full CI required for this SHA." >&2; exit 1; }

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and publish the release image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:production-${{ github.sha }}

      - name: Attest the release image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Print the manual activation inputs
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -Eeuo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo "### Trading Lab production release candidate"
            echo
            echo "Activate by hand in aiaiaiai-org/infra → Actions → **Deploy workload** (branch master), once per row,"
            echo "with \`secrets_image\` left empty: infra takes Trading Lab's secrets from Core's delivered envelope."
            echo
            echo "| workload | image |"
            echo "| --- | --- |"
            for workload in market-trading-lab market-trading-lab-okx-collector; do
              echo "| \`$workload\` | \`$IMAGE@$IMAGE_DIGEST\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
